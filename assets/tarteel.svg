    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a13" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff6a13" stop-opacity="0"/>
