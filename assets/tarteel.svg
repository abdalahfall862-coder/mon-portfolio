    <rect x="628" y="140" width="140" height="320" rx="22" fill="#050b13" stroke="#475569" stroke-width="3"/>
    <rect x="636" y="152" width="124" height="296" rx="15" fill="url(#screen)"/>
    <rect x="636" y="152" width="124" height="34" rx="15" fill="#0d2b38"/>
    <text x="698" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">Tableau de bord</text>
    <g fill="#123c4c">
